<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Brand Name</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
  width: 90px;
  height: 90px;
  margin: 0 auto 18px;
  border-radius: 50%;
  overflow: hidden;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      width: 100%;
      text-decoration: none;
      color: #111;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s ease;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.04);
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: #111;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .link:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 35px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <main class="container">

   <div class="logo">
  <img src="CADJEWELS.jpg" alt="CAD Jewels Logo">
</div>

    <h1>CADJEWELS</h1>

    <p class="subtitle">
      Connect with us
    </p>

    <div class="links">

      <a
        class="link"
        href="https://www.instagram.com/cadjewels_modeling/"
        target="_blank"
      >
        Instagram
      </a>

      <a
        class="link"
        href="https://www.facebook.com/profile.php?id=61578260183870"
        target="_blank"
      >
        Facebook
      </a>

      <a
        class="link"
        href="https://cadjewels.com/"
        target="_blank"
      >
        Website
      </a>

      <a
        class="link"
        href="https://wa.me/37444762501"
        target="_blank"
      >
        WhatsApp
      </a>

    </div>

    <footer>
      © 2026 CADJEWELS
    </footer>

  </main>

</body>
</html>
