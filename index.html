<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CADJEWELS</title>

  <link rel="icon" type="image/jpeg" href="CADJEWELS.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #111;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* =========================
       LOGO
    ========================== */

    .logo {
      width: 105px;
      height: 105px;
      margin: 0 auto 20px;

      border-radius: 50%;
      overflow: hidden;

      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    .logo img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;
    }

    /* =========================
       TITLE
    ========================== */

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 32px;
    }

    /* =========================
       LINKS
    ========================== */

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      width: 100%;

      text-decoration: none;

      color: #111;
      background: #fff;

      border: 1px solid #e6e6e6;
      border-radius: 16px;

      padding: 16px 18px;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      gap: 12px;

      font-size: 16px;
      font-weight: 600;
      line-height: 1;

      transition:
        transform 0.2s ease,
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.04);
    }

    .link svg {
      width: 21px;
      height: 21px;

      flex-shrink: 0;
      display: block;
    }

    .link span {
      display: block;
    }

    /* =========================
       DESKTOP HOVER
    ========================== */

    .link:hover {
      transform: translateY(-3px);
      color: #fff;

      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
    }

    /* Instagram */

    .instagram:hover {
      background: linear-gradient(
        135deg,
        #833ab4,
        #c13584,
        #e1306c,
        #fd1d1d,
        #f77737
      );

      border-color: transparent;
    }

    /* Facebook */

    .facebook:hover {
      background: #1877f2;
      border-color: #1877f2;
    }

    /* LinkedIn */

    .linkedin:hover {
      background: #0a66c2;
      border-color: #0a66c2;
    }

    /* Website */

    .website:hover {
      background: #111;
      border-color: #111;
    }

    /* WhatsApp */

    .whatsapp:hover {
      background: #25d366;
      border-color: #25d366;
    }

    .link:active {
      transform: scale(0.98);
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      margin-top: 35px;
      font-size: 12px;
      color: #aaa;
    }

    /* =========================
       MOBILE / TOUCH DEVICES
       Brand colors always visible
    ========================== */

    @media (hover: none), (pointer: coarse) {

      body {
        padding: 20px;
      }

      .container {
        max-width: 100%;
      }

      .link {
        padding: 17px 18px;
        color: #fff;

        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
      }

      /* Instagram */

      .instagram {
        background: linear-gradient(
          135deg,
          #833ab4,
          #c13584,
          #e1306c,
          #fd1d1d,
          #f77737
        );

        border-color: transparent;
      }

      /* Facebook */

      .facebook {
        background: #1877f2;
        border-color: #1877f2;
      }

      /* LinkedIn */

      .linkedin {
        background: #0a66c2;
        border-color: #0a66c2;
      }

      /* Website */

      .website {
        background: #111;
        border-color: #111;
      }

      /* WhatsApp */

      .whatsapp {
        background: #25d366;
        border-color: #25d366;
      }

      .link:hover {
        transform: none;
      }

      .link:active {
        transform: scale(0.97);
      }
    }

  </style>
</head>

<body>

    <!-- LOGO -->

    </div>


    <!-- FOOTER -->

    <footer>

    </footer>

  </main>

</body>
