<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CADJEWELS</title>

<link rel="icon" type="image/jpeg" href="CADJEWELS.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
  width: 90px;
  height: 90px;
  margin: 0 auto 18px;
  border-radius: 50%;
  overflow: hidden;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      width: 100%;
      text-decoration: none;
      color: #111;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s ease;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.04);
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: #111;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .link:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 35px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <main class="container">

   <div class="logo">
  <img src="CADJEWELS.jpg" alt="CAD Jewels Logo">
</div>

    <h1>CADJEWELS</h1>

    <p class="subtitle">
      Connect with us
    </p>

    <div class="links">

  <a
    class="link"
    href="https://instagram.com/YOUR_USERNAME"
    target="_blank"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
      <circle cx="12" cy="12" r="4"></circle>
      <circle cx="17.5" cy="6.5" r="1"></circle>
    </svg>
    <span>Instagram</span>
  </a>

  <a
    class="link"
    href="https://facebook.com/YOUR_PAGE"
    target="_blank"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M14 8h3V4h-3c-3 0-5 2-5 5v2H6v4h3v7h4v-7h3l1-4h-4V9c0-.7.3-1 1-1z"></path>
    </svg>
    <span>Facebook</span>
  </a>

  <a
    class="link"
    href="https://yourwebsite.com"
    target="_blank"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M3 12h18"></path>
      <path d="M12 3c3 3 3 15 0 18"></path>
      <path d="M12 3c-3 3-3 15 0 18"></path>
    </svg>
    <span>Website</span>
  </a>

  <a
    class="link"
    href="https://wa.me/374XXXXXXXX"
    target="_blank"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.4-4A8 8 0 1 1 20 11.5z"></path>
      <path d="M9 8.5c.3 2.2 2.3 4.2 4.5 4.5"></path>
    </svg>
    <span>WhatsApp</span>
  </a>

</div>
    <footer>
      © 2026 CADJEWELS
    </footer>

  </main>

</body>
</html>
